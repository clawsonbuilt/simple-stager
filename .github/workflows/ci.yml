name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholder values only; CI never talks to real services.
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        # Root "type-check" script has no matching turbo task, so run tsc in the web app.
        run: npx tsc --noEmit
        working-directory: apps/web
      - name: Lint
        # TODO(cleanup): 83 pre-existing eslint errors; fix then remove continue-on-error.
        continue-on-error: true
        run: npm run lint
      - name: Build
        run: npm run build
